[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "farm02gate-robotctrl_jd045"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对机器人运动控制工程师·回归集与线上样本的差分相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "farm02gate" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://farm02gate.github.io"
Repository = "https://github.com/farm02gate/robotctrl_jd045"
Issues = "https://github.com/farm02gate/robotctrl_jd045/issues"

[project.scripts]
robotctrl_jd045 = "robotctrl_jd045:main"

[tool.setuptools]
py-modules = ["robotctrl_jd045"]
